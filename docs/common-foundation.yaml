    decisionLog: design-decisions
    foundationContract: implementation-contract
  referenceStrategy:
    conventionBaseline: improved-reference-project
    retain:
      - status-specific-runtime-exceptions
      - controller-advice
      - handler-interceptor
      - session-key-constant
      - data-jpa-test
    reject:
      - plaintext-password-comparison
      - system-out
      - javascript-error-response
      - trivial-interceptor-overrides
  testing:
    repository: data-jpa-test
    application: context-load
    additionalCoverage:
      - core-service-business-rules
      - administrator-interceptor
    classNaming: TargetTest
    methodNaming: method-condition-expected
    displayName: required
    structure: given-when-then
    assertions: assertj
  requirements:
    timebox: one-day
    operatorModel: single-administrator-cms
    mustHave:
      - public-post-list
      - public-post-detail
      - administrator-login-logout
      - administrator-post-crud
      - draft-publish-workflow
      - category-management
      - tag-management
      - basic-error-pages
    outOfScope:
      - public-registration
      - multiple-authors
      - comments
      - likes
      - image-file-upload
      - full-text-search
      - title-search
      - pagination
      - scheduled-publication
      - deleted-post-recovery
      - deployment
    doneWhen:
      - build-and-automated-tests-pass
      - application-starts-locally
      - public-reading-and-taxonomy-filtering-work
      - administrator-authentication-and-management-work
      - unauthenticated-management-access-is-blocked
      - defined-error-pages-handle-major-errors
      - no-real-secrets-are-committed
  api:
    enabled: false
    transport: spring-mvc-html-form
    successMutation: post-redirect-get
    contractDocument: screen-design.md
  packageStructure:
    style: domain-centered
    domains:
      - administrator
      - post
      - category
      - tag
    sharedRoot: _core
    layerFirstRootPackages: false
  ui:
    palette:
      background: '#FFF8F3'
      surface: '#FFFFFF'
      primary: '#EFA66F'
      primaryStrong: '#A65324'
      primarySoft: '#FFF0E4'
      text: '#302824'
      mutedText: '#75665E'
      success: '#3F7D5A'
      warning: '#A76524'
      danger: '#B85450'
    excludedControls:
      - search-input-and-button
      - pagination-controls
      - unsupported-feature-actions
  business:
    administrator:
      cardinality: one
      bootstrap: environment-variables
      createOnlyWhenMissing: true
    post:
      states:
        - DRAFT
        - PUBLISHED
      transitions:
        - DRAFT_TO_PUBLISHED
        - PUBLISHED_TO_DRAFT
      deletion: physical
      scheduledPublication: false
      recovery: false
      summary: false
    category:
      minimumPerPost: 0
      maximumPerPost: 1
      normalizedNameUnique: true
      deleteWhenInUse: false
    tag:
      minimumPerPost: 0
      maximumPerPost: 5
      normalizedNameUnique: true
      deleteWhenInUse: false
    authentication:
      loginSuccess: redirect-admin-post-list
      loginFailure: generic-credential-error
      unauthenticatedManagementAccess: redirect-login
      logoutMethod: POST
      logoutResult: invalidate-session-and-redirect-public-list
    visibility:
      publicPostStates:
        - PUBLISHED
      hiddenDraftAccess: not-found
    requestHandling:
      invalidForm: redisplay-with-errors-and-input
      successfulMutation: post-redirect-get
      missingResource: not-found
      duplicateTaxonomy: reject-with-message
      deleteTaxonomyInUse: reject-with-message
  database:
    profiles:
      local: h2-memory
      dev: mysql-environment-variables
      test: h2
    auditAutomation:
      observed: hibernate-creation-timestamp
      improved: spring-data-jpa-auditing
      modern: database-managed-defaults-and-triggers
      recommendation: spring-data-jpa-auditing
      selected: spring-data-jpa-auditing
      selectionState: confirmed
    tables:
      - administrator
      - category
      - post
      - tag
      - post_tag
    constraints:
      unique:
        - administrator.username
        - category.normalized_name
        - tag.normalized_name
        - post_tag.post_id+tag_id
      checks:
        - post.status=DRAFT|PUBLISHED
      foreignKeyDeletion:
        post.category_id: restrict
        post_tag.post_id: cascade
        post_tag.tag_id: restrict
      maximumTagsPerPost: 5
    indexes:
      - post.status+created_at
      - post.category_id+status+created_at
      - post_tag.tag_id+post_id
    erd: mermaid
