<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게시글 작성·수정</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="wireframe.css" rel="stylesheet">
</head>
<body>
  <div class="wireframe-note">게시글 작성·수정 · 카테고리는 0..1개, 태그는 최대 5개입니다. 오류 시 입력값을 유지합니다.</div>
  <header class="site-header"><nav class="navbar page-shell"><a class="navbar-brand" href="admin-post-list.html">CMS</a><a class="nav-link ms-auto" href="admin-post-list.html">게시글 목록</a></nav></header>
  <main class="page-main page-shell">
    <div class="mb-4"><p class="eyebrow mb-1">Editor</p><h1 class="h2">게시글 작성</h1></div>
    <form class="surface p-4" action="#" method="post">
      <div class="alert message-error" role="alert">입력 내용을 확인해 주세요.</div>
      <div class="mb-4"><label class="form-label" for="title">제목</label><input class="form-control is-invalid" id="title" name="title" value="JPA Auditing으로" required><div class="invalid-feedback">제목은 5자 이상 입력해 주세요.</div></div>
      <div class="mb-4"><label class="form-label" for="content">본문</label><textarea class="form-control" id="content" name="content" rows="12" required>여러 엔티티가 공통으로 사용하는 작성 시각은...</textarea><div class="form-text">초안 상태에서도 제목과 본문은 입력합니다.</div></div>
      <div class="row g-4 mb-4">
        <div class="col-md-5"><label class="form-label" for="category">카테고리</label><select class="form-select" id="category" name="categoryId"><option value="">미지정</option><option selected>Spring</option><option>Java</option></select></div>
        <fieldset class="col-md-7"><legend class="form-label fs-6">태그 <span class="muted fw-normal">(최대 5개)</span></legend><div class="d-flex flex-wrap gap-3"><label><input class="form-check-input me-1" type="checkbox" checked> JPA</label><label><input class="form-check-input me-1" type="checkbox" checked> SpringBoot</label><label><input class="form-check-input me-1" type="checkbox"> MVC</label></div></fieldset>
      </div>
      <div class="d-flex flex-wrap justify-content-between gap-3 border-top pt-4"><button class="btn btn-outline-danger" type="button">삭제</button><div class="d-flex gap-2"><a class="btn btn-outline-secondary" href="admin-post-list.html">취소</a><button class="btn btn-outline-primary" type="submit">초안 저장</button><button class="btn btn-primary" type="submit">공개</button></div></div>
    </form>
  </main>
</body>
</html>
