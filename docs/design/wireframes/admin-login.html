<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 로그인</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="wireframe.css" rel="stylesheet">
</head>
<body>
  <div class="wireframe-note">관리자 로그인 · GET/POST /admin/login · 인증 실패 메시지는 계정 존재 여부를 노출하지 않습니다.</div>
  <header class="site-header"><nav class="navbar page-shell"><a class="navbar-brand" href="public-post-list.html">개발 기록</a><a class="nav-link ms-auto" href="public-post-list.html">블로그로 돌아가기</a></nav></header>
  <main class="page-main page-shell d-flex justify-content-center">
    <section class="surface p-4 p-md-5 w-100" style="max-width: 460px" aria-labelledby="login-title">
      <p class="eyebrow mb-2">Administrator</p><h1 id="login-title" class="h2 mb-2">관리자 로그인</h1><p class="muted mb-4">콘텐츠를 관리하려면 로그인하세요.</p>
      <div class="alert message-error" role="alert">아이디 또는 비밀번호를 확인해 주세요.</div>
      <form action="#" method="post">
        <div class="mb-3"><label class="form-label" for="username">아이디</label><input class="form-control" id="username" name="username" autocomplete="username" required></div>
        <div class="mb-4"><label class="form-label" for="password">비밀번호</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-primary w-100" type="submit">로그인</button>
      </form>
    </section>
  </main>
</body>
</html>
