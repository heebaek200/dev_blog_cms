server:
  servlet:
    session:
      tracking-modes: cookie    # 세션 번호를 쿠키로만 전달 (주소에 ;jsessionid를 붙이지 않음)

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: devblogcms
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  mustache:
    servlet:
      expose-session-attributes: true   # Mustache 파일에서 세션값 사용