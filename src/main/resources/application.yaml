server:
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      tracking-modes: cookie

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: devblogcms
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  mustache:
    servlet:
      expose-session-attributes: true
  jpa:
    open-in-view: false
